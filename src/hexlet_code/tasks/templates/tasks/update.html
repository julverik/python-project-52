{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Изменение задачи</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label for="id_name" class="block text-sm font-medium text-gray-700 mb-1">
                Имя
            </label>
            <input type="text" name="name" id="id_name" value="{{ form.name.value|default:'' }}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div class="mb-4">
            <label for="id_description" class="block text-sm font-medium text-gray-700 mb-1">
                Описание
            </label>
            <textarea name="description" id="id_description" rows="5" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">{{ form.description.value|default:'' }}</textarea>
        </div>
        <div class="mb-4">
            <label for="id_status" class="block text-sm font-medium text-gray-700 mb-1">
                Статус
            </label>
            <select name="status" id="id_status" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="">---------</option>
                {% for status in form.fields.status.queryset %}
                <option value="{{ status.id }}" {% if form.status.value == status.id %}selected{% endif %}>{{ status.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-4">
            <label for="id_executor" class="block text-sm font-medium text-gray-700 mb-1">
                Исполнитель
            </label>
            <select name="executor" id="id_executor" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="">---------</option>
                {% for user in form.fields.executor.queryset %}
                <option value="{{ user.id }}" {% if form.executor.value == user.id %}selected{% endif %}>{{ user.username }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition duration-200">
            Изменить
        </button>
    </form>
</div>
{% endblock %}
