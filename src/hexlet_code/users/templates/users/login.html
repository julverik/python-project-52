{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Вход</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">
                Имя пользователя
            </label>
            <input type="text" name="username" id="id_username" class="w-full border border-gray-300 rounded-lg px-4 py-2">
        </div>
        <div class="mb-4">
            <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">
                Пароль
            </label>
            <input type="password" name="password" id="id_password" class="w-full border border-gray-300 rounded-lg px-4 py-2">
        </div>
        {% if form.errors %}
        <div class="text-red-600 text-sm mb-4">
            Имя пользователя и пароль не совпадают. Попробуйте снова.
        </div>
        {% endif %}
        <div class="mt-6">
            <button type="submit" style="background-color: #2563eb; color: white; padding: 10px 24px; border-radius: 8px; border: none; font-weight: 500; cursor: pointer;">
                Войти
            </button>
        </div>
    </form>
</div>
{% endblock %}
