{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Менеджер задач{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex space-x-8">
                    <a href="/" class="flex items-center text-gray-700 hover:text-gray-900 font-medium">
                        Менеджер задач
                    </a>
                    <a href="/users/" class="flex items-center text-gray-700 hover:text-gray-900">
                        Пользователи
                    </a>
                </div>
                <div class="flex space-x-4 items-center">
                    <a href="/login/" class="text-gray-700 hover:text-gray-900">
                        Вход
                    </a>
                    <a href="/register/" class="text-gray-700 hover:text-gray-900">
                        Регистрация
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
