{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md text-center">
    <h1 class="text-2xl font-bold mb-4">Удаление пользователя</h1>
    <p class="mb-6 text-gray-700">Вы уверены, что хотите удалить пользователя <strong>{{ user.username }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="flex justify-center space-x-4">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition duration-200">
                Да, удалить
            </button>
            <a href="{% url 'users:users' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-2 px-6 rounded-lg transition duration-200">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
