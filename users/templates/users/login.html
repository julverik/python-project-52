{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6 text-center">Вход</h1>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
            <input type="text" name="username" id="id_username" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div class="mb-4">
            <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
            <input type="password" name="password" id="id_password" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>
        {% if form.errors %}
        <div class="text-red-600 text-sm mb-4">
            Имя пользователя и пароль не совпадают. Попробуйте снова.
        </div>
        {% endif %}
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition duration-200">
            Войти
        </button>
    </form>
</div>
{% endblock %}
